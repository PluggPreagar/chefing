<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erklär-Skizzen</title>
<style>
:root { --bg:#f6f3ee; --panel:#fffdf9; --ink:#2a2622; --muted:#6f675f; --line:#e4ddd3;
  --skz-oel:#e2b93b; --skz-wasser:#8fb6c9; --skz-emul:#f3ead0; --skz-teig:#d8b98a; --skz-teig-hell:#e8d4b0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1a17; --panel:#262320; --ink:#eee8df; --muted:#a79d91; --line:#3a352f;
  --skz-oel:#c99a1c; --skz-wasser:#4f7f96; --skz-emul:#6a6150; --skz-teig:#8a6d45; --skz-teig-hell:#a8895c; } }
:root[data-theme="dark"] { --bg:#1c1a17; --panel:#262320; --ink:#eee8df; --muted:#a79d91; --line:#3a352f;
  --skz-oel:#c99a1c; --skz-wasser:#4f7f96; --skz-emul:#6a6150; --skz-teig:#8a6d45; --skz-teig-hell:#a8895c; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 14px; }
.reihe { display:flex; flex-wrap:wrap; gap:14px; }
.karte { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; flex:1 1 280px; max-width:360px; }
.key { font:12px ui-monospace, monospace; color:var(--muted); margin:0 0 4px; }
.k-skizze { margin:0; } .k-skizze figcaption { font-size:13px; font-weight:600; }
.k-skizze .skz { width:100%; height:auto; display:block; } .k-skizze .skz-t { font-size:9px; fill:var(--muted); }
.k-skizze .skz-legende { font-size:12px; color:var(--muted); margin:.2rem 0 0; }
</style></head><body>
<h1>Erklär-Skizzen im Ablauf</h1>
<p class="sub">So erscheinen sie in den Details des Schritts (DR-055). Hell und dunkel folgen dem System.</p>
<div class="reihe">
<section class="karte"><p class="key">puerierstab</p><figure class="k-skizze"><figcaption>Pürierstab im Mixbecher</figcaption><svg viewBox="0 0 232 128" role="img" aria-label="Pürierstab: Schichten, unten halten, hochziehen, fertig" class="skz">
  <g transform="translate(4,8)">
    <rect x="1.5" y="28" width="41" height="50" fill="var(--skz-oel)"/><rect x="1.5" y="78" width="41" height="16.5" fill="var(--skz-wasser)"/>
    <rect x="0" y="0" width="44" height="96" rx="5" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
    <text x="22" y="114" text-anchor="middle" class="skz-t">1 Schichten</text>
  </g>
  <g transform="translate(62,8)">
    <rect x="1.5" y="28" width="41" height="44" fill="var(--skz-oel)"/><rect x="1.5" y="72" width="41" height="22.5" fill="var(--skz-emul)"/><rect x="19" y="-10" width="6" height="94" fill="var(--muted)"/><rect x="13" y="84" width="18" height="5" rx="1" fill="var(--muted)"/>
    <rect x="0" y="0" width="44" height="96" rx="5" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
    <text x="22" y="114" text-anchor="middle" class="skz-t">2 unten</text>
  </g>
  <g transform="translate(120,8)">
    <rect x="1.5" y="28" width="41" height="16" fill="var(--skz-oel)"/><rect x="1.5" y="44" width="41" height="50.5" fill="var(--skz-emul)"/><rect x="19" y="-10" width="6" height="50" fill="var(--muted)"/><rect x="13" y="40" width="18" height="5" rx="1" fill="var(--muted)"/><path d="M36 86 L36 54 M32 60 L36 54 L40 60" stroke="var(--ink)" stroke-width="1.6" fill="none"/>
    <rect x="0" y="0" width="44" height="96" rx="5" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
    <text x="22" y="114" text-anchor="middle" class="skz-t">3 hoch</text>
  </g>
  <g transform="translate(178,8)">
    <rect x="1.5" y="34" width="41" height="60.5" fill="var(--skz-emul)"/>
    <rect x="0" y="0" width="44" height="96" rx="5" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
    <text x="22" y="114" text-anchor="middle" class="skz-t">4 fertig</text>
  </g></svg><p class="skz-legende">gelb = Öl · blau = Wasserphase (Eigelb, Säure, Senf) · hell = Emulsion (Öl in Wasser)</p></figure></section>
<section class="karte"><p class="key">tropfenweise</p><figure class="k-skizze"><figcaption>Öl erst tropfenweise, dann im Strahl</figcaption><svg viewBox="0 0 232 128" role="img" aria-label="Von Hand: Tropfen, bindet, Strahl, fest" class="skz"><g transform="translate(4,8)"><path d="M12.8 69.0 L14.4 70.2 L15.9 71.2 L17.4 72.0 L18.9 72.6 L20.5 72.9 L22.0 73.0 L23.5 72.9 L25.1 72.6 L26.6 72.0 L28.1 71.2 L29.6 70.2 L31.2 69.0 Z" fill="var(--skz-wasser)"/><path d="M22 20 q3 6 0 8 q-3 -2 0 -8" fill="var(--skz-oel)"/><path d="M22 36 q3 6 0 8 q-3 -2 0 -8" fill="var(--skz-oel)"/><path d="M0 50 Q22 96 44 50" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="22" y="114" text-anchor="middle" class="skz-t">1 Tropfen</text></g><g transform="translate(62,8)"><path d="M9.0 65.0 L11.2 67.4 L13.4 69.4 L15.5 71.0 L17.7 72.1 L19.8 72.8 L22.0 73.0 L24.2 72.8 L26.3 72.1 L28.5 71.0 L30.6 69.4 L32.8 67.4 L35.0 65.0 Z" fill="var(--skz-emul)"/><path d="M22 26 q3 6 0 8 q-3 -2 0 -8" fill="var(--skz-oel)"/><path d="M0 50 Q22 96 44 50" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="22" y="114" text-anchor="middle" class="skz-t">2 bindet</text></g><g transform="translate(120,8)"><path d="M5.5 60.0 L8.2 64.0 L11.0 67.2 L13.7 69.8 L16.5 71.6 L19.2 72.6 L22.0 73.0 L24.8 72.6 L27.5 71.6 L30.3 69.8 L33.0 67.2 L35.8 64.0 L38.5 60.0 Z" fill="var(--skz-emul)"/><rect x="21" y="6" width="2.5" height="48" fill="var(--skz-oel)"/><path d="M0 50 Q22 96 44 50" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="22" y="114" text-anchor="middle" class="skz-t">3 Strahl</text></g><g transform="translate(178,8)"><path d="M2.5 55.0 L5.8 60.5 L9.0 65.0 L12.3 68.5 L15.5 71.0 L18.8 72.5 L22.0 73.0 L25.2 72.5 L28.5 71.0 L31.7 68.5 L35.0 65.0 L38.2 60.5 L41.5 55.0 Z" fill="var(--skz-emul)"/><path d="M0 50 Q22 96 44 50" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="22" y="114" text-anchor="middle" class="skz-t">4 fest</text></g></svg><p class="skz-legende">Die Emulsion wächst: erst wenn sie bindet (dicklich, glänzend), trägt sie mehr Öl auf einmal.</p></figure></section>
<section class="karte"><p class="key">unterheben</p><figure class="k-skizze"><figcaption>Eischnee unterheben</figcaption><svg viewBox="0 0 232 128" role="img" aria-label="Eischnee unterheben: ein Drittel, Rest darauf, von unten heben" class="skz"><g transform="translate(2,8)"><path d="M6 54 Q30 92 54 54 Z" fill="var(--skz-teig)"/><circle cx="30" cy="46" r="8" fill="var(--skz-emul)" stroke="var(--muted)" stroke-width=".8"/><path d="M0 40 Q30 104 60 40" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="30" y="114" text-anchor="middle" class="skz-t">1 ⅓ unterrühren</text></g><g transform="translate(84,8)"><path d="M6 54 Q30 92 54 54 Z" fill="var(--skz-teig-hell)"/><circle cx="22" cy="44" r="9" fill="var(--skz-emul)" stroke="var(--muted)" stroke-width=".8"/><circle cx="38" cy="42" r="9" fill="var(--skz-emul)" stroke="var(--muted)" stroke-width=".8"/><path d="M0 40 Q30 104 60 40" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="30" y="114" text-anchor="middle" class="skz-t">2 Rest darauf</text></g><g transform="translate(166,8)"><path d="M6 54 Q30 92 54 54 Z" fill="var(--skz-teig-hell)"/><circle cx="24" cy="58" r="4" fill="var(--skz-emul)" stroke="var(--muted)" stroke-width=".8"/><path d="M15 60 Q30 74 44 54" fill="none" stroke="var(--ink)" stroke-width="1.6"/><path d="M39 53 L44 54 L44 59" fill="none" stroke="var(--ink)" stroke-width="1.6"/><path d="M0 40 Q30 104 60 40" fill="none" stroke="var(--ink)" stroke-width="1.6"/><text x="30" y="114" text-anchor="middle" class="skz-t">3 heben</text></g></svg><p class="skz-legende">Erst ein Drittel unterrühren (lockert den Teig), den Rest mit dem Spatel von unten nach oben heben — nicht rühren.</p></figure></section>
</div>
</body></html>
